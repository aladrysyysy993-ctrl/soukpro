<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoukPro - متجرك في دقيقتين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;margin:0;padding:0;box-sizing:border-box}
body{background:#f7f7f7}
header{background:#00A651;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px}
.btn{background:#fff;color:#00A651;padding:8px 18px;border-radius:20px;border:none;font-weight:900;cursor:pointer}
.hero{background:#00A651;color:#fff;text-align:center;padding:40px 20px;border-radius:0 0 30px 30px}
.hero h1{font-size:30px}
.hero p{margin:10px 0 20px;opacity:.9}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:150px;object-fit:cover}
.card .info{padding:10px}
.price{color:#00A651;font-weight:900;font-size:18px}
.old{color:#999;text-decoration:line-through;font-size:13px}
.add{width:100%;background:#00A651;color:#fff;border:none;padding:10px;border-radius:10px;margin-top:8px;font-weight:700;cursor:pointer}
.cart-bar{position:fixed;bottom:15px;left:15px;right:15px;background:#111;color:#fff;padding:15px;border-radius:15px;display:flex;justify-content:space-between;align-items:center}
#checkout{display:none;background:#fff;margin:15px;padding:20px;border-radius:20px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<header><b>🛍️ SoukPro</b><button class="btn">ابدأ مجانا</button></header>
<div class="hero">
<h1>صايب متجرك في 2 دقائق</h1>
<p>بحال YouCan ولكن ساهل، مغربي 100%، والدفع عند التوصيل</p>
</div>
<div id="products" class="products"></div>
<div id="checkout">
<h2>إتمام الطلب - الدفع عند التوصيل</h2>
<input id="name" placeholder="الاسم الكامل">
<input id="phone" placeholder="رقم الهاتف 06...">
<select id="city" onchange="calcShip()">
<option value="25">الدار البيضاء - 25 درهم</option>
<option value="30">الرباط - 30 درهم</option>
<option value="35">فاس - 35 درهم</option>
<option value="35">مراكش - 35 درهم</option>
<option value="40">طنجة - 40 درهم</option>
<option value="40">أكادير - 40 درهم</option>
</select>
<input id="address" placeholder="العنوان بالكامل">
<p id="total"></p>
<button class="add" onclick="confirmOrder()">أكد الطلب ✅</button>
</div>
<div class="cart-bar" onclick="showCheckout()">
<span>🛒 السلة: <b id="count">0</b></span>
<span><b id="sum">0 درهم</b> - أطلب دابا -></span>
</div>
<script>
const data=[
{name:"ساعة ذكية Ultra",price:299,old:499,img:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=400"},
{name:"سماعات AirPods",price:199,old:349,img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400"},
{name:"حذاء رياضي",price:249,old:399,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{name:"عطر عود ملكي",price:149,old:250,img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"},
];
let cart=0,total=0;
let html="";
data.forEach((p)=>{
html+=`<div class="card"><img src="${p.img}"><div class="info"><b>${p.name}</b><br><span class="price">${p.price} درهم</span> <span class="old">${p.old} درهم</span><button class="add" onclick="add(${p.price})">أضف للسلة +</button></div></div>`
});
document.getElementById('products').innerHTML=html;
function add(price){cart++;total+=price;document.getElementById('count').innerText=cart;document.getElementById('sum').innerText=total+" درهم";alert("تزاد للسلة ✅")}
function showCheckout(){document.getElementById('checkout').style.display='block';calcShip();window.scrollTo(0,500)}
function calcShip(){let s=parseInt(document.getElementById('city').value);document.getElementById('total').innerHTML=`المجموع: ${total} + الشحن ${s} = <b>${total+s} درهم</b>`}
function confirmOrder(){let n=document.getElementById('name').value;let ph=document.getElementById('phone').value;alert(`شكرا ${n} ✅ طلبك تسجل! غادي نعيطو ليك في: ${ph}`)}
</script>
</body>
  </html>
